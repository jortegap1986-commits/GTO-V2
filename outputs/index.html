<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====== Historika · La Gran Pirámide — animación base 100 % código ======
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SERIF='"Liberation Serif","DejaVu Serif",serif';
const OL='#2b1a10', GOLD='#c8932c', INK='#3a2210';
const PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const eout=k=>1-Math.pow(1-k,3);
const back=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function blink(t,seed){const p=2.4+hash(seed)*2.2;const ph=(t+hash(seed+9)*5)%p;return ph<.16?Math.abs(Math.cos(ph/.16*PI)):1}
function talk(t,k=1,seed=0){return clamp((.5+.5*Math.sin(t*17+seed))*(.55+.45*Math.sin(t*5.3+seed*2)))*k}
function mix(a,b,k){const o={};for(const key in a){const va=a[key],vb=b[key]===undefined?va:b[key];
  if(Array.isArray(va))o[key]=va.map((v,i)=>lerp(v,vb[i],k));else if(typeof va==='number')o[key]=lerp(va,vb,k);else o[key]=k<.5?va:vb;}
  for(const key in b)if(o[key]===undefined)o[key]=b[key];return o}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(clamp(amt<0?v*(1+amt):v+(255-v)*amt,0,255));return `rgb(${f(r)},${f(g)},${f(b)})`}
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');

// ---------- expresiones base ----------
const FACE={
  neutral:{look:[0,0],brow:0,browUp:0,smile:.25,open:0,eyes:'normal',sweat:0,blush:0,tilt:0,squint:1},
  think:{look:[.4,-1],brow:-.4,browUp:.4,smile:-.05,open:0,eyes:'normal',tilt:-.06,squint:.85},
  idea:{look:[.6,-.2],brow:-.3,browUp:1.2,smile:.9,open:.65,eyes:'wide',tilt:.04,squint:1},
  happy:{look:[.3,0],brow:-.2,browUp:.5,smile:1,open:.35,eyes:'normal',blush:.5},
  laugh:{look:[0,0],brow:-.3,browUp:.6,smile:1,open:.7,eyes:'happy',blush:.6},
  strain:{look:[.5,.1],brow:1,browUp:-.2,smile:-.45,open:.18,eyes:'normal',sweat:1,blush:.45,squint:.45},
  surprise:{look:[-.4,0],brow:-.5,browUp:1.3,smile:.1,open:.6,eyes:'wide',squint:1},
  proud:{look:[.2,-.1],brow:-.1,browUp:.3,smile:.8,open:0,eyes:'normal',blush:.3,squint:.8},
};
const F=(name,extra)=>Object.assign({},FACE.neutral,FACE[name],extra||{});

// ---------- rig de personaje ----------
function limb(p,a1,l1,a2,l2,w,col){
  const k={x:p.x+Math.sin(a1)*l1,y:p.y+Math.cos(a1)*l1};
  const e={x:k.x+Math.sin(a1+a2)*l2,y:k.y+Math.cos(a1+a2)*l2};
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(k.x,k.y);ctx.lineTo(e.x,e.y);
  ctx.strokeStyle=OL;ctx.lineWidth=w+8;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
  e.a=a1+a2;return e;
}
function blob(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}
function foot(e,col){ctx.beginPath();ctx.ellipse(e.x+9,e.y-3,17,8,0,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}

function person(o){
  const P=Object.assign({la1:-.12,la2:.15,ra1:.12,ra2:.2,ll1:-.06,ll2:0,rl1:.06,rl2:0},o.pose||{});
  const Fc=Object.assign({},FACE.neutral,o.face||{});
  const skin=o.skin||'#b8743f',sd=shade(skin,-.2),t=o.t||0,seed=o.seed||1,s=o.s||1,dir=o.dir||1,lean=o.lean||0;
  if(!o.noShadow){ctx.save();ctx.translate(o.x,o.shadowY||o.y);ctx.scale(s,s);ctx.beginPath();ctx.ellipse(0,0,62,13,0,0,2*PI);ctx.fillStyle='rgba(60,30,10,.2)';ctx.fill();ctx.restore()}
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(s*dir,s);ctx.rotate(lean);
  const br=Math.sin(t*2.3+seed)*1.6;
  const shB={x:-10,y:-204+br},shF={x:12,y:-204+br};
  // brazo trasero
  const hb=limb(shB,P.la1,52,P.la2,48,17,sd);blob(hb.x,hb.y,11,sd);if(o.holdB)o.holdB(hb);
  // piernas
  const fb=limb({x:-8,y:-124},P.ll1,62,P.ll2,60,21,sd);foot(fb,sd);
  const ff=limb({x:9,y:-124},P.rl1,62,P.rl2,60,21,skin);foot(ff,skin);
  // torso
  ctx.beginPath();ctx.moveTo(-31,-208+br);ctx.quadraticCurveTo(0,-217+br,33,-208+br);
  if(o.belly){ctx.quadraticCurveTo(58,-160,30,-128)}else ctx.lineTo(26,-128);
  ctx.lineTo(-25,-128);ctx.closePath();ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  // faldellín (shendyt)
  const kl=o.longKilt?-40:-84;
  ctx.beginPath();ctx.moveTo(-28,-140);ctx.lineTo(31,-140);ctx.lineTo(40+P.rl1*18,kl);ctx.lineTo(-35+P.ll1*10,kl);ctx.closePath();
  ctx.fillStyle=o.kilt||'#f3ead2';ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(14,-136);ctx.lineTo(28+P.rl1*10,kl+4);ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle=o.belt||'#c9a14a';ctx.fillRect(-29,-146,61,11);ctx.lineWidth=4;ctx.strokeRect(-29,-146,61,11);
  // collar usekh
  if(o.collar){const cols=o.collar;for(let i=cols.length-1;i>=0;i--){ctx.beginPath();ctx.ellipse(2,-206+br,34+i*0,10+i*9,0,0,PI);ctx.fillStyle=cols[i];ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.stroke()}}
  // cabeza
  ctx.save();ctx.translate(4,-214+br);ctx.rotate(Fc.tilt||0);
  ctx.fillStyle=skin;ctx.fillRect(-11,-16,22,20);ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.strokeRect(-11,-16,22,20);
  if(o.collar){ctx.beginPath();ctx.ellipse(-2,8,34,10,0,0,PI);ctx.fillStyle=o.collar[0];ctx.fill();ctx.lineWidth=3;ctx.stroke()}
  const hy=-50;
  if(o.hat==='nemes'){ // lienzo real, parte trasera
    ctx.save();ctx.beginPath();ctx.moveTo(-46,hy-30);ctx.lineTo(40,hy-30);ctx.lineTo(30,hy+62);ctx.lineTo(-62,hy+66);ctx.lineTo(-66,hy+10);ctx.closePath();
    ctx.fillStyle='#e9b93a';ctx.fill();ctx.clip();ctx.fillStyle='#2f4f9a';for(let y=hy-30;y<hy+70;y+=16)ctx.fillRect(-80,y,140,7);ctx.restore();
    ctx.beginPath();ctx.moveTo(-46,hy-30);ctx.lineTo(40,hy-30);ctx.lineTo(30,hy+62);ctx.lineTo(-62,hy+66);ctx.lineTo(-66,hy+10);ctx.closePath();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke();
  }
  if(o.hat==='wig'){ctx.beginPath();ctx.ellipse(-16,hy+2,46,50,0,0,2*PI);ctx.fillStyle=o.hair||'#1d1410';ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}
  ctx.beginPath();ctx.arc(0,hy,50,0,2*PI);ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  // oreja
  ctx.beginPath();ctx.ellipse(-18,hy+4,9,13,0,0,2*PI);ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=4;ctx.stroke();
  if(o.hat==='wig'){ctx.save();ctx.beginPath();ctx.arc(0,hy,53,0,2*PI);ctx.clip();ctx.beginPath();
    ctx.moveTo(-70,hy+40);ctx.lineTo(-70,hy-70);ctx.lineTo(70,hy-70);ctx.lineTo(70,hy-28);ctx.quadraticCurveTo(20,hy-36,-6,hy-26);ctx.quadraticCurveTo(-30,hy-10,-34,hy+40);ctx.closePath();
    ctx.fillStyle=o.hair||'#1d1410';ctx.fill();ctx.restore();
    if(o.band){ctx.save();ctx.beginPath();ctx.arc(0,hy,53,0,2*PI);ctx.clip();ctx.strokeStyle=o.band;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(-60,hy-14);ctx.quadraticCurveTo(10,hy-40,60,hy-30);ctx.stroke();ctx.restore()}
    ctx.beginPath();ctx.arc(0,hy,50,PI*1.02,PI*1.98);ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();}
  if(o.hat==='nemes'){ctx.save();ctx.beginPath();ctx.arc(0,hy,55,0,2*PI);ctx.clip();ctx.beginPath();ctx.rect(-70,hy-80,140,52);ctx.fillStyle='#e9b93a';ctx.fill();
    ctx.fillStyle='#2f4f9a';for(let x=-70;x<70;x+=16)ctx.fillRect(x,hy-80,7,52);ctx.restore();
    ctx.beginPath();ctx.moveTo(-54,hy-26);ctx.quadraticCurveTo(0,hy-36,52,hy-26);ctx.lineWidth=6;ctx.strokeStyle=OL;ctx.stroke();
    ctx.beginPath();ctx.arc(0,hy,50,PI*1.08,PI*1.92);ctx.lineWidth=5;ctx.stroke();
    // lienzo delantero sobre la oreja
    ctx.save();ctx.beginPath();ctx.moveTo(-44,hy-24);ctx.lineTo(-18,hy-26);ctx.lineTo(-14,hy+66);ctx.lineTo(-40,hy+66);ctx.closePath();ctx.fillStyle='#e9b93a';ctx.fill();ctx.clip();ctx.fillStyle='#2f4f9a';for(let y=hy-24;y<hy+70;y+=14)ctx.fillRect(-50,y,40,6);ctx.restore();
    ctx.beginPath();ctx.moveTo(-44,hy-24);ctx.lineTo(-18,hy-26);ctx.lineTo(-14,hy+66);ctx.lineTo(-40,hy+66);ctx.closePath();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
    // ureo
    ctx.beginPath();ctx.moveTo(26,hy-30);ctx.quadraticCurveTo(36,hy-56,28,hy-60);ctx.quadraticCurveTo(20,hy-50,26,hy-30);ctx.fillStyle='#f0c23c';ctx.fill();ctx.lineWidth=3;ctx.stroke();
    blob(29,hy-55,3.5,'#c0392b');}
  if(o.hat==='bald'){ctx.beginPath();ctx.arc(-8,hy-28,12,PI*1.1,PI*1.6);ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=5;ctx.stroke()}
  drawFace(Fc,t,seed,hy,o);
  if(o.beard){ctx.fillStyle='#22305e';ctx.beginPath();ctx.moveTo(8,hy+46);ctx.lineTo(22,hy+46);ctx.lineTo(24,hy+80);ctx.lineTo(10,hy+82);ctx.closePath();ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
    ctx.strokeStyle='#e9b93a';ctx.lineWidth=2;for(let y=hy+54;y<hy+80;y+=7){ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(23,y);ctx.stroke()}}
  ctx.restore();
  // brazo delantero
  const hf=limb(shF,P.ra1,52,P.ra2,48,17,skin);
  if(o.holdUnder)o.holdUnder(hf);
  blob(hf.x,hf.y,11,skin);if(o.hold)o.hold(hf);
  ctx.restore();
  const cl=Math.cos(lean),sl=Math.sin(lean);
  return {hand:{x:o.x+s*dir*(cl*hf.x-sl*hf.y),y:o.y+s*(sl*hf.x+cl*hf.y)}};
}
function drawFace(Fc,t,seed,hy,o){
  const fx=14,ey=hy-6;
  let op=blink(t,seed)*(Fc.squint==null?1:Fc.squint);if(Fc.eyes==='wide')op*=1.25;
  const eyesX=[fx-17,fx+13];
  eyesX.forEach((ex,i)=>{
    const sc=i==0?1:.92;ctx.lineWidth=4;ctx.strokeStyle=OL;
    if(Fc.eyes==='happy'){ctx.beginPath();ctx.moveTo(ex-10,ey+4);ctx.quadraticCurveTo(ex,ey-11,ex+10,ey+4);ctx.lineWidth=5;ctx.stroke()}
    else if(Fc.eyes==='closed'||op<.16){ctx.beginPath();ctx.moveTo(ex-10,ey+1);ctx.quadraticCurveTo(ex,ey+7,ex+10,ey+1);ctx.lineWidth=4.5;ctx.stroke()}
    else{const rx=11*sc,ry=13*op*sc;ctx.save();ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,2*PI);ctx.fillStyle='#fffaf0';ctx.fill();ctx.clip();
      const px=ex+3+Fc.look[0]*4.5,py=ey+Fc.look[1]*5;ctx.beginPath();ctx.arc(px,py,Fc.eyes==='wide'?5.5:7.2,0,2*PI);ctx.fillStyle='#1d120b';ctx.fill();
      ctx.beginPath();ctx.arc(px+2.2,py-2.6,2.2,0,2*PI);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
      ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,2*PI);ctx.lineWidth=3.5;ctx.stroke();}
    // kohl
    const od=i==0?-1:1;ctx.beginPath();ctx.moveTo(ex+od*10,ey);ctx.lineTo(ex+od*17,ey-4);ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
    // ceja
    const s=i==0?1:-1,by=ey-21-(Fc.browUp||0)*9;
    ctx.beginPath();ctx.moveTo(ex-s*10,by-(Fc.brow||0)*6);ctx.lineTo(ex+s*9,by+(Fc.brow||0)*6);ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();
  });
  // nariz
  ctx.beginPath();ctx.moveTo(fx+4,hy+2);ctx.quadraticCurveTo(fx+17,hy+13,fx+4,hy+16);ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
  // mejillas
  if(Fc.blush>0){ctx.fillStyle=`rgba(225,85,70,${Fc.blush*.45})`;ctx.beginPath();ctx.ellipse(fx-26,hy+20,9,6,0,0,2*PI);ctx.fill();ctx.beginPath();ctx.ellipse(fx+26,hy+20,8,6,0,0,2*PI);ctx.fill()}
  // boca
  const mx=fx-2,my=hy+30,mw=13+Fc.open*4,sm=Fc.smile*12;
  if(Fc.open>.06){ctx.beginPath();ctx.moveTo(mx-mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm*.5,mx+mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm*.5+Fc.open*34,mx-mw,my-sm*.35);ctx.closePath();
    ctx.fillStyle='#5a1a14';ctx.fill();ctx.save();ctx.clip();ctx.fillStyle='#d9675a';ctx.beginPath();ctx.ellipse(mx,my+sm*.5+Fc.open*24,mw*.6,Fc.open*9+2,0,0,2*PI);ctx.fill();
    ctx.fillStyle='#fffaf0';ctx.fillRect(mx-mw,my-sm*.35-12,mw*2,10+sm*.4);ctx.restore();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(mx-mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm,mx+mw,my-sm*.35);ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}
  // sudor
  if(Fc.sweat>0){for(let k=0;k<2;k++){const ph=((t*1.3+seed*.37+k*.5)%1);const x=fx+40-k*58,y=hy-30+ph*44;ctx.globalAlpha=Fc.sweat*(1-ph);
    ctx.beginPath();ctx.moveTo(x,y-10);ctx.quadraticCurveTo(x+7,y+2,x,y+5);ctx.quadraticCurveTo(x-7,y+2,x,y-10);ctx.fillStyle='#bfe6ff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#3a6d8f';ctx.stroke();ctx.globalAlpha=1}}
}
function walkPose(ph,amp=.42){const s=Math.sin(ph),c=Math.cos(ph);
  return{ll1:s*amp,ll2:-Math.max(0,c)*.65,rl1:-s*amp,rl2:-Math.max(0,-c)*.65,la1:-s*.45,la2:.3,ra1:s*.45,ra2:.3}}
const bob=ph=>-Math.abs(Math.cos(ph))*7;

// ---------- utilería ----------
function jar(h,tilt=0,col='#b5652f'){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(tilt);ctx.beginPath();ctx.moveTo(-10,-14);ctx.quadraticCurveTo(-34,10,-16,46);ctx.lineTo(16,46);ctx.quadraticCurveTo(34,10,10,-14);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();ctx.fillStyle=shade(col,-.25);ctx.fillRect(-12,-22,24,9);ctx.strokeRect(-12,-22,24,9);
  ctx.strokeStyle='rgba(255,230,190,.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,12);ctx.lineTo(18,12);ctx.stroke();ctx.restore()}
function mallet(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(-h.a);ctx.fillStyle='#8a5a2b';ctx.fillRect(-5,-6,10,50);ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.strokeRect(-5,-6,10,50);
  ctx.beginPath();ctx.roundRect(-22,40,44,30,8);ctx.fillStyle='#a8743d';ctx.fill();ctx.stroke();ctx.restore()}
function chisel(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(-h.a);ctx.fillStyle='#c27a45';ctx.fillRect(-4,-10,8,46);ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.strokeRect(-4,-10,8,46);ctx.restore()}
function lever(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(-h.a);ctx.fillStyle='#7c512a';ctx.fillRect(-6,-30,12,170);ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.strokeRect(-6,-30,12,170);ctx.restore()}
function bread(h,bite=0){ctx.save();ctx.translate(h.x,h.y-6);ctx.beginPath();ctx.moveTo(-14,8);ctx.quadraticCurveTo(0,-40,14,8);ctx.closePath();ctx.fillStyle='#d79a4e';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
  if(bite){ctx.beginPath();ctx.arc(8,-18,8,0,2*PI);ctx.fillStyle='#f3d9a8';ctx.fill()}ctx.restore()}
function mug(h){ctx.save();ctx.translate(h.x,h.y);ctx.beginPath();ctx.moveTo(-14,-34);ctx.lineTo(14,-34);ctx.lineTo(10,8);ctx.lineTo(-10,8);ctx.closePath();ctx.fillStyle='#b5652f';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,-36,15,6,0,0,2*PI);ctx.fillStyle='#f6e8c0';ctx.fill();ctx.stroke();ctx.restore()}
function scrollProp(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(.3);ctx.beginPath();ctx.roundRect(-9,-34,18,60,6);ctx.fillStyle='#f0deae';ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();ctx.restore()}
function basket(x,y,w=70){ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w/2-8,y+30);ctx.lineTo(x-w/2+8,y+30);ctx.closePath();ctx.fillStyle='#b98a45';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
  ctx.strokeStyle='rgba(60,30,10,.45)';ctx.lineWidth=2.5;for(let i=-w/2+10;i<w/2;i+=12){ctx.beginPath();ctx.moveTo(x+i,y+2);ctx.lineTo(x+i,y+28);ctx.stroke()}}

// ---------- escenario ----------
function sky(c0,c1){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c0);g.addColorStop(1,c1);ctx.fillStyle=g;ctx.fillRect(-300,-300,W+600,H+600)}
function sun(x,y,r,col,glow=.5){const g=ctx.createRadialGradient(x,y,r*.3,x,y,r*4);g.addColorStop(0,`rgba(255,240,190,${glow})`);g.addColorStop(1,'rgba(255,240,190,0)');ctx.fillStyle=g;ctx.fillRect(x-r*4,y-r*4,r*8,r*8);blobNoOL(x,y,r,col)}
function blobNoOL(x,y,r,col){ctx.beginPath();ctx.arc(x,y,r,0,2*PI);ctx.fillStyle=col;ctx.fill()}
function dune(y,col,amp,off,freq){ctx.beginPath();ctx.moveTo(-300,H+300);for(let x=-300;x<=W+300;x+=16)ctx.lineTo(x,y+Math.sin((x+off)*freq)*amp+Math.sin((x+off)*freq*2.3+1)*amp*.4);ctx.lineTo(W+300,H+300);ctx.closePath();ctx.fillStyle=col;ctx.fill()}
function specks(y0,y1,off,n,seed,col='rgba(120,70,30,.25)'){ctx.fillStyle=col;for(let i=0;i<n;i++){const x=((hash(i+seed)*1600-off)%1600+1600)%1600-260,y=y0+hash(i*3.7+seed)*(y1-y0);ctx.fillRect(x,y,4+hash(i)*5,3)}}
function palm(x,y,s,t,k=0){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.strokeStyle='#7a5228';ctx.lineWidth=16;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(20,-140,8,-280);ctx.stroke();
  ctx.translate(8,-280);const sw=Math.sin(t*1.4+k)*.08;for(let i=0;i<7;i++){const a=-PI/2+(i-3)*.48+sw;ctx.save();ctx.rotate(a);ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(70,-30,140,30);ctx.quadraticCurveTo(70,0,0,0);ctx.fillStyle=i%2?'#3f7a3a':'#4f8f42';ctx.fill();ctx.restore()}ctx.restore()}
function pyramid(cx,by,w,h,p,lit,dark,opt={}){
  const apx=cx,apy=by-h,L={x:cx-w/2,y:by},R={x:cx+w/2,y:by},E={x:cx+w*.16,y:by};

    for(let i=0;i<8;i++){const k=(u*3+i/8)%1;blobNoOL(600+(hash(i)-.5)*70*k,1640-Math.sin(k*PI)*40,5,'rgba(160,210,240,.9)')}}

// 5 · Time-lapse de 20 años
function S5(u){
  const a=u*2*PI/1.8-PI*.3,day=clamp(.5+.5*Math.sin(a)*1.6);

  sun(540+Math.cos(a)*620,1200-Math.sin(a)*900,70,'#fff1c4',.5*day);

    ctx.fillStyle='#eadbb5';ctx.fillRect(x-12,y-24,24,20);ctx.strokeRect(x-12,y-24,24,20);
    person({x:x+30,y:y-2,s:.2,dir:1,t:u,seed:60+i,skin:SK[i%5],hat:'wig',lean:.4,pose:walkPose(u*12+i,.4),face:F('neutral'),noShadow:1})}
  ctx.fillStyle=`rgba(40,30,70,${(1-day)*.25})`;ctx.fillRect(-200,-200,W+400,H+400);

    pose:{la1:.4,la2:.6,ra1:1.2,ra2:1.1},face:u<4.4?F('proud',{look:[.4,lookUp]}):F('surprise',{look:[-.6,-.2]}),hold:scrollProp,shadowY:1890});
  ctx.restore();
  const yr=1+Math.floor(eio(seg(u,.2,4.8))*19);
  ctx.save();ctx.font=`bold 44px ${SERIF}`;ctx.textAlign='center';ctx.fillStyle='#fff4d8';ctx.strokeStyle='#3a2210';ctx.lineWidth=8;ctx.strokeText('AÑO',380,1560);ctx.fillText('AÑO',380,1560);
  ctx.font=`bold 190px ${SERIF}`;const pk=1+.12*Math.exp(-((u*19/4.6)%1)*5);ctx.translate(380,1720);ctx.scale(pk,pk);ctx.lineWidth=16;ctx.strokeText(yr,0,0);ctx.fillStyle='#e9b93a';ctx.fillText(yr,0,0);ctx.restore();
  card([['Unos 20 años de obra,',52],['según Heródoto.',46,'#8a3b1c','italic bold']],330,u,.3,4.2);
  bigText('¿ERAN ESCLAVOS?',540,380,96,'#9a2a14',u,4.4,5.5,{rot:-.03});

// 6 · El poblado de los obreros
function S6(u){

    {x:210,dir:1,face:F('laugh',{open:.5+talk(u,.3)}),pose:{la1:.6,la2:.8,ra1:2.9+cheer*.15,ra2:.2},hold:mug,skin:SK[0],band:'#c0392b'},

    {x:880,dir:-1,face:F('happy',{open:talk(u,.6,3),look:[0,-.2]}),pose:{la1:.3,la2:.4,ra1:2.2+Math.sin(u*3)*.2,ra2:-.3},hold:mug,skin:SK[3],band:'#3f8a5a'},

  basket(860,1555,110);for(let i=0;i<4;i++)bread({x:828+i*22,y:1556});

// 7 · La pirámide terminada + cierre

  person({x:960,y:1830+j(1.5),s:1.25,dir:-1,t:u,seed:82,skin:SK[3],hat:'wig',band:'#c0392b',pose:{la1:-2.6,la2:-.2,ra1:2.7,ra2:.2,ll1:-.2,ll2:-.3,rl1:.3,rl2:-.3},face:F('happy',{open:.55}),shadowY:1830});

}

const SC=[S1,S2,S3,S4,S5,S6,S7];
const DUR=29.2,TS=38/DUR;
function render(t){t*=TS;
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);
  let i=0;while(i<T.length-2&&t>=T[i+1])i++;
  SC[i](t-T[i]);
  vignette(.42);
  // transiciones (variadas)
  const fl=(c,a,d)=>{const k=1-clamp(Math.abs(t-a)/d);if(k>0){ctx.fillStyle=c;ctx.globalAlpha=k;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}};
  fl('#fff8e6',4.5,.18);fl('#fff8e6',10.5,.2);fl('#1a0e05',16,.22);fl('#fff8e6',23,.18);fl('#1a0e05',28.5,.2);fl('#ffffff',33,.25);
  if(t<.35){ctx.fillStyle='#000';ctx.globalAlpha=1-t/.35;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
  const end=seg(t,37.55,37.92);if(end>0){ctx.fillStyle='#000';ctx.globalAlpha=end;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
window.render=render;window.READY=true;render(0);
</script></body></html>
