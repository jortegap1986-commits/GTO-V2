<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ====== Historika · Gaugamela 331 a. C. — mapa estratégico animado, 100 % código ======
const W=1080,H=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const SERIF='"Liberation Serif","DejaVu Serif",serif';
const OL='#2b1a10',INK='#3a2210',PI=Math.PI;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const eout=k=>1-Math.pow(1-k,3);
const back=k=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
function blink(t,seed){const p=2.4+hash(seed)*2.2;const ph=(t+hash(seed+9)*5)%p;return ph<.16?Math.abs(Math.cos(ph/.16*PI)):1}
function talk(t,k=1,seed=0){return clamp((.5+.5*Math.sin(t*17+seed))*(.55+.45*Math.sin(t*5.3+seed*2)))*k}
function vis(t,a,b,fi=.35,fo=.3){return Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b))}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.round(clamp(amt<0?v*(1+amt):v+(255-v)*amt,0,255));return `rgb(${f(r)},${f(g)},${f(b)})`}
function mix(a,b,k){const o={};for(const key in a){const va=a[key],vb=b[key]===undefined?va:b[key];
  if(Array.isArray(va))o[key]=va.map((v,i)=>lerp(v,vb[i],k));else if(typeof va==='number')o[key]=lerp(va,vb,k);else o[key]=k<.5?va:vb;}
  for(const key in b)if(o[key]===undefined)o[key]=b[key];return o}
function blobNoOL(x,y,r,col){ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,2*PI);ctx.fillStyle=col;ctx.fill()}
function blob(x,y,r,col,lw=4.5){ctx.beginPath();ctx.arc(x,y,r,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=lw;ctx.strokeStyle=OL;ctx.stroke()}

// ================= RIG DE PERSONAJES =================
const FACE={
  neutral:{look:[0,0],brow:0,browUp:0,smile:.25,open:0,eyes:'normal',sweat:0,blush:0,tilt:0,squint:1},
  smug:{look:[.6,0],brow:.25,browUp:.1,smile:.7,open:0,squint:.72},
  sly:{look:[1,.1],brow:.35,browUp:0,smile:.55,open:0,squint:.6},
  order:{look:[.9,.2],brow:.9,browUp:-.1,smile:-.4,open:.3,squint:.8},
  eager:{look:[.9,.4],brow:-.1,browUp:.5,smile:.8,open:.3,squint:.9},
  shock:{look:[.9,.3],brow:-.7,browUp:1.2,smile:-.3,open:.6,eyes:'wide',squint:1},
  fear:{look:[1,0],brow:-1,browUp:1.1,smile:-.7,open:.55,eyes:'wide',sweat:1,squint:1},
  shout:{look:[1,0],brow:1,browUp:-.2,smile:.05,open:.85,squint:.85},
  determined:{look:[1,-.1],brow:.8,browUp:0,smile:.2,open:0,squint:.75},
  worried:{look:[.6,0],brow:-.8,browUp:.6,smile:-.4,open:.25,sweat:1,squint:.95},
  surprise:{look:[.8,0],brow:-.5,browUp:1.3,smile:.1,open:.6,eyes:'wide'},
  happy:{look:[.3,0],brow:-.2,browUp:.5,smile:1,open:.35,blush:.4},
  laugh:{look:[0,0],brow:-.3,browUp:.6,smile:1,open:.7,eyes:'happy',blush:.5},
  relief:{look:[.4,0],brow:-.5,browUp:.4,smile:.8,open:0,eyes:'happy',blush:.3},
};
const F=(name,extra)=>Object.assign({},FACE.neutral,FACE[name],extra||{});

function limb(p,a1,l1,a2,l2,w,col){
  const k={x:p.x+Math.sin(a1)*l1,y:p.y+Math.cos(a1)*l1};
  const e={x:k.x+Math.sin(a1+a2)*l2,y:k.y+Math.cos(a1+a2)*l2};
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(k.x,k.y);ctx.lineTo(e.x,e.y);
  ctx.strokeStyle=OL;ctx.lineWidth=w+8;ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
  e.a=a1+a2;return e;
}
function foot(e,col){ctx.beginPath();ctx.ellipse(e.x+9,e.y-3,17,8,0,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}
function person(o){
  const P=Object.assign({la1:-.12,la2:.15,ra1:.12,ra2:.2,ll1:-.06,ll2:0,rl1:.06,rl2:0},o.pose||{});
  const Fc=Object.assign({},FACE.neutral,o.face||{});
  const skin=o.skin||'#d9a679',sd=shade(skin,-.2),t=o.t||0,seed=o.seed||1,s=o.s||1,dir=o.dir||1,lean=o.lean||0;
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(s*dir,s);ctx.rotate(lean);
  const br=Math.sin(t*2.3+seed)*1.6;
  if(o.backExtra)o.backExtra(br,t);
  const shB={x:-10,y:-204+br},shF={x:12,y:-204+br};
  const hb=limb(shB,P.la1,52,P.la2,48,17,o.sleeve?shade(o.sleeve,-.2):sd);blob(hb.x,hb.y,11,sd);if(o.holdB)o.holdB(hb);
  if(!o.noLegs){const fb=limb({x:-8,y:-124},P.ll1,62,P.ll2,60,21,sd);foot(fb,o.boot||sd);
    const ff=limb({x:9,y:-124},P.rl1,62,P.rl2,60,21,skin);foot(ff,o.boot||skin);}
  ctx.beginPath();ctx.moveTo(-31,-208+br);ctx.quadraticCurveTo(0,-217+br,33,-208+br);ctx.lineTo(26,-128);ctx.lineTo(-25,-128);ctx.closePath();
  ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-28,-140);ctx.lineTo(31,-140);ctx.lineTo(40+P.rl1*18,-84);ctx.lineTo(-35+P.ll1*10,-84);ctx.closePath();
  ctx.fillStyle=o.kilt||'#f3ead2';ctx.fill();ctx.stroke();
  if(o.torsoExtra)o.torsoExtra(br,t,P);
  ctx.save();ctx.translate(4,-214+br);ctx.rotate(Fc.tilt||0);
  ctx.fillStyle=skin;ctx.fillRect(-11,-16,22,20);ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.strokeRect(-11,-16,22,20);
  const hy=-50;
  if(o.headBack)o.headBack(hy,t);
  ctx.beginPath();ctx.arc(0,hy,50,0,2*PI);ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.beginPath();ctx.ellipse(-18,hy+4,9,13,0,0,2*PI);ctx.fillStyle=skin;ctx.fill();ctx.lineWidth=4;ctx.stroke();
  if(o.hair){ctx.save();ctx.beginPath();ctx.arc(0,hy,53,0,2*PI);ctx.clip();ctx.beginPath();
    ctx.moveTo(-70,hy+30);ctx.lineTo(-70,hy-70);ctx.lineTo(70,hy-70);ctx.lineTo(70,hy-30);ctx.quadraticCurveTo(30,hy-46,10,hy-30);ctx.quadraticCurveTo(-20,hy-30,-30,hy-12);ctx.lineTo(-34,hy+30);ctx.closePath();
    ctx.fillStyle=o.hair;ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(0,hy,50,PI*1.02,PI*1.98);ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke()}
  drawFace(Fc,t,seed,hy);
  if(o.headExtra){o.headExtra(hy,t,Fc);drawMouth(Fc,hy)}
  ctx.restore();
  const hf=limb(shF,P.ra1,52,P.ra2,48,17,o.sleeve||skin);
  if(o.holdUnder)o.holdUnder(hf);
  blob(hf.x,hf.y,11,skin);if(o.hold)o.hold(hf);
  ctx.restore();
}
function drawMouth(Fc,hy){
  const fx=14,mx=fx-2,my=hy+30,mw=13+Fc.open*4,sm=Fc.smile*12;
  if(Fc.open>.06){ctx.beginPath();ctx.moveTo(mx-mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm*.5,mx+mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm*.5+Fc.open*34,mx-mw,my-sm*.35);ctx.closePath();
    ctx.fillStyle='#5a1a14';ctx.fill();ctx.save();ctx.clip();ctx.fillStyle='#d9675a';ctx.beginPath();ctx.ellipse(mx,my+sm*.5+Fc.open*24,mw*.6,Fc.open*9+2,0,0,2*PI);ctx.fill();
    ctx.fillStyle='#fffaf0';ctx.fillRect(mx-mw,my-sm*.35-12,mw*2,10+sm*.4);ctx.restore();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke()}
  else{ctx.beginPath();ctx.moveTo(mx-mw,my-sm*.35);ctx.quadraticCurveTo(mx,my+sm,mx+mw,my-sm*.35);ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}
}
function drawFace(Fc,t,seed,hy){
  const fx=14,ey=hy-6;
  let op=blink(t,seed)*(Fc.squint==null?1:Fc.squint);if(Fc.eyes==='wide')op*=1.25;
  [fx-17,fx+13].forEach((ex,i)=>{
    const sc=i==0?1:.92;ctx.lineWidth=4;ctx.strokeStyle=OL;
    if(Fc.eyes==='happy'){ctx.beginPath();ctx.moveTo(ex-10,ey+4);ctx.quadraticCurveTo(ex,ey-11,ex+10,ey+4);ctx.lineWidth=5;ctx.stroke()}
    else if(op<.16){ctx.beginPath();ctx.moveTo(ex-10,ey+1);ctx.quadraticCurveTo(ex,ey+7,ex+10,ey+1);ctx.lineWidth=4.5;ctx.stroke()}
    else{const rx=11*sc,ry=13*op*sc;ctx.save();ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,2*PI);ctx.fillStyle='#fffaf0';ctx.fill();ctx.clip();
      const px=ex+3+Fc.look[0]*4.5,py=ey+Fc.look[1]*5;ctx.beginPath();ctx.arc(px,py,Fc.eyes==='wide'?5.5:7.2,0,2*PI);ctx.fillStyle='#1d120b';ctx.fill();
      ctx.beginPath();ctx.arc(px+2.2,py-2.6,2.2,0,2*PI);ctx.fillStyle='#fff';ctx.fill();ctx.restore();
      ctx.beginPath();ctx.ellipse(ex,ey,rx,ry,0,0,2*PI);ctx.lineWidth=3.5;ctx.stroke();}
    const s=i==0?1:-1,by=ey-21-(Fc.browUp||0)*9;
    ctx.beginPath();ctx.moveTo(ex-s*10,by-(Fc.brow||0)*6);ctx.lineTo(ex+s*9,by+(Fc.brow||0)*6);ctx.lineWidth=6;ctx.lineCap='round';ctx.strokeStyle=OL;ctx.stroke();
  });
  ctx.beginPath();ctx.moveTo(fx+4,hy+2);ctx.quadraticCurveTo(fx+17,hy+13,fx+4,hy+16);ctx.lineWidth=3.5;ctx.strokeStyle=OL;ctx.stroke();
  if(Fc.blush>0){ctx.fillStyle=`rgba(225,85,70,${Fc.blush*.45})`;ctx.beginPath();ctx.ellipse(fx-26,hy+20,9,6,0,0,2*PI);ctx.fill();ctx.beginPath();ctx.ellipse(fx+26,hy+20,8,6,0,0,2*PI);ctx.fill()}
  drawMouth(Fc,hy);
  if(Fc.sweat>0){for(let k=0;k<2;k++){const ph=((t*1.3+seed*.37+k*.5)%1);const x=fx+40-k*58,y=hy-24+ph*44;ctx.globalAlpha*=1;ctx.save();ctx.globalAlpha=Fc.sweat*(1-ph);
    ctx.beginPath();ctx.moveTo(x,y-10);ctx.quadraticCurveTo(x+7,y+2,x,y+5);ctx.quadraticCurveTo(x-7,y+2,x,y-10);ctx.fillStyle='#bfe6ff';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#3a6d8f';ctx.stroke();ctx.restore()}}
}

// ---- vestuario ----
function helmet(crest,sway=0){return (hy,t)=>{
  if(crest){const sw=Math.sin(t*6)*4+sway;ctx.beginPath();ctx.moveTo(34,hy-46);ctx.quadraticCurveTo(-4,hy-116,-52,hy-62);ctx.quadraticCurveTo(-82+sw,hy-20,-74+sw,hy+26);
    ctx.quadraticCurveTo(-50,hy-28,-10,hy-58);ctx.quadraticCurveTo(10,hy-62,34,hy-46);ctx.closePath();ctx.fillStyle=crest;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=2;for(let k=0;k<5;k++){ctx.beginPath();ctx.moveTo(20-k*14,hy-60-k*6);ctx.quadraticCurveTo(-30-k*6,hy-80,-56-k*3+sw,hy-10+k*6);ctx.stroke()}}
  ctx.save();ctx.beginPath();ctx.arc(0,hy,54,0,2*PI);ctx.clip();
  ctx.beginPath();ctx.moveTo(-70,hy-90);ctx.lineTo(70,hy-90);ctx.lineTo(70,hy-38);ctx.quadraticCurveTo(30,hy-46,-4,hy-36);ctx.quadraticCurveTo(-26,hy-24,-30,hy+2);ctx.lineTo(-24,hy+34);ctx.lineTo(-70,hy+36);ctx.closePath();
  const g=ctx.createLinearGradient(-50,hy-60,40,hy);g.addColorStop(0,'#e7bf5c');g.addColorStop(1,'#a8782a');ctx.fillStyle=g;ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.beginPath();ctx.arc(-16,hy-40,26,PI*1.15,PI*1.6);ctx.strokeStyle='rgba(255,250,220,.6)';ctx.lineWidth=5;ctx.stroke();ctx.restore();
  ctx.beginPath();ctx.arc(0,hy,50,PI*1.0,PI*1.95);ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
}}
function greekBeard(col){return (hy)=>{ctx.beginPath();ctx.moveTo(-20,hy+16);ctx.quadraticCurveTo(-24,hy+70,4,hy+80);ctx.quadraticCurveTo(36,hy+82,46,hy+18);ctx.quadraticCurveTo(30,hy+44,12,hy+46);ctx.quadraticCurveTo(-8,hy+44,-20,hy+16);
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();ctx.beginPath();ctx.moveTo(-2,hy+22);ctx.quadraticCurveTo(12,hy+16,30,hy+22);ctx.lineWidth=7;ctx.strokeStyle=col;ctx.stroke()}}
function persianHead(hy,t,Fc){
  // tiara real (kidaris)
  ctx.beginPath();ctx.moveTo(-46,hy-26);ctx.lineTo(-40,hy-122);ctx.quadraticCurveTo(0,hy-132,40,hy-122);ctx.lineTo(46,hy-28);ctx.quadraticCurveTo(0,hy-40,-46,hy-26);ctx.closePath();
  ctx.fillStyle='#f1e9d2';ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.save();ctx.clip();ctx.fillStyle='#2f4f9a';ctx.fillRect(-60,hy-58,120,22);ctx.fillStyle='#d4a52f';for(let x=-50;x<50;x+=16){ctx.beginPath();ctx.moveTo(x,hy-58);ctx.lineTo(x+8,hy-70);ctx.lineTo(x+16,hy-58);ctx.fill()}
  ctx.fillStyle='#d4a52f';ctx.fillRect(-60,hy-128,120,10);ctx.restore();
  // barba rizada
  ctx.beginPath();ctx.moveTo(-24,hy+12);ctx.quadraticCurveTo(-32,hy+86,-4,hy+104);ctx.lineTo(32,hy+104);ctx.quadraticCurveTo(52,hy+70,46,hy+14);ctx.quadraticCurveTo(30,hy+46,12,hy+48);ctx.quadraticCurveTo(-10,hy+46,-24,hy+12);
  ctx.fillStyle='#1d1410';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.22)';ctx.lineWidth=2.5;for(let r=0;r<4;r++)for(let c=0;c<4;c++){ctx.beginPath();ctx.arc(-10+c*13+(r%2)*6,hy+58+r*12,5,0,PI);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(-4,hy+22);ctx.quadraticCurveTo(12,hy+14,34,hy+22);ctx.lineWidth=8;ctx.strokeStyle='#1d1410';ctx.stroke();
}
function persianHair(hy){ctx.beginPath();ctx.ellipse(-28,hy+24,34,46,0,0,2*PI);ctx.fillStyle='#1d1410';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2.5;for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(-40+k*6,hy+40+k*8,6,0,PI);ctx.stroke()}}
function greekArmor(col='#efe4c8'){return (br)=>{ctx.beginPath();ctx.moveTo(-31,-206+br);ctx.quadraticCurveTo(0,-215+br,33,-206+br);ctx.lineTo(27,-132);ctx.lineTo(-26,-132);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.fillStyle='#d4a52f';ctx.beginPath();ctx.arc(2,-172,12,0,2*PI);ctx.fill();ctx.lineWidth=3;ctx.stroke();
  for(let i=0;i<6;i++){ctx.fillStyle=i%2?'#efe4c8':'#b3362c';ctx.fillRect(-27+i*10,-134,10,40);ctx.lineWidth=2.5;ctx.strokeRect(-27+i*10,-134,10,40)}}}
function chlamys(col='#b3322b'){return (br,t)=>{const sw=Math.sin(t*7)*14;ctx.beginPath();ctx.moveTo(-26,-210+br);ctx.quadraticCurveTo(-90,-170,-130+sw,-60);ctx.lineTo(-70+sw*.5,-50);ctx.quadraticCurveTo(-40,-140,-6,-204+br);ctx.closePath();
  ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4.5;ctx.strokeStyle=OL;ctx.stroke()}}
function robe(br){ctx.beginPath();ctx.moveTo(-33,-208+br);ctx.quadraticCurveTo(0,-218+br,35,-208+br);ctx.lineTo(56,-20);ctx.lineTo(-52,-20);ctx.closePath();
  ctx.fillStyle='#5b2a7a';ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();ctx.fillStyle='#f1e9d2';ctx.fillRect(-2,-205,14,185);ctx.strokeRect(-2,-205,14,185);
  ctx.fillStyle='#d4a52f';ctx.fillRect(-52,-34,108,10);}
function sword(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(-h.a);ctx.fillStyle='#6b4a2a';ctx.fillRect(-14,-4,28,7);ctx.beginPath();ctx.moveTo(-6,4);ctx.lineTo(6,4);ctx.lineTo(3,78);ctx.lineTo(0,86);ctx.lineTo(-3,78);ctx.closePath();
  ctx.fillStyle='#e6ecf0';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.stroke();ctx.restore()}
function sarissaProp(h){ctx.save();ctx.translate(h.x,h.y);ctx.rotate(-h.a);ctx.strokeStyle='#7a5228';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(0,-260);ctx.lineTo(0,120);ctx.stroke();ctx.restore()}

// ---- caballo y carro (vista lateral) ----
function horse(x,y,s,t,dir,col,ph,opt={}){
  ctx.save();ctx.translate(x,y+Math.sin(ph*2)*4*s);ctx.scale(s*dir,s);ctx.rotate(Math.sin(ph)*.04);
  const dk=shade(col,-.25);
  const leg=(px,py,a1,a2,c)=>{const e=limb({x:px,y:py},a1,46,a2,46,13,c);ctx.beginPath();ctx.ellipse(e.x+3,e.y,8,5,0,0,2*PI);ctx.fillStyle='#222';ctx.fill()};
  // cola
  ctx.beginPath();ctx.moveTo(-66,-122);ctx.quadraticCurveTo(-110,-120+Math.sin(ph)*10,-118,-70+Math.sin(ph*1.3)*12);ctx.lineWidth=14;ctx.strokeStyle=opt.mane||'#2a1a12';ctx.lineCap='round';ctx.stroke();
  leg(-42,-100,-.5*Math.sin(ph+1.2)-.1,.6*Math.max(0,Math.sin(ph+2.4)),dk);leg(44,-100,.6*Math.sin(ph)+.1,-.9*Math.max(0,Math.cos(ph)),dk);
  ctx.beginPath();ctx.ellipse(0,-112,72,34,0,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=5;ctx.strokeStyle=OL;ctx.stroke();
  ctx.beginPath();ctx.moveTo(36,-132);ctx.lineTo(78,-196);ctx.lineTo(100,-186);ctx.lineTo(66,-100);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.stroke();
  ctx.save();ctx.translate(100,-186);ctx.rotate(.55);ctx.beginPath();ctx.ellipse(16,0,34,15,0,0,2*PI);ctx.fillStyle=col;ctx.fill();ctx.stroke();
  blobNoOL(6,-5,3.5,'#111');ctx.beginPath();ctx.moveTo(-6,-12);ctx.lineTo(-2,-28);ctx.lineTo(6,-12);ctx.fillStyle=col;ctx.fill();ctx.stroke();blobNoOL(44,4,2.5,'#111');ctx.restore();
  ctx.beginPath();ctx.moveTo(40,-140);ctx.quadraticCurveTo(66,-200,84,-200);ctx.lineWidth=12;ctx.strokeStyle=opt.mane||'#2a1a12';ctx.stroke();
  if(opt.cloth){ctx.beginPath();ctx.ellipse(-4,-140,40,14,0,0,2*PI);ctx.fillStyle=opt.cloth;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=OL;ctx.stroke()}
  leg(-30,-100,-.6*Math.sin(ph+.9),.7*Math.max(0,Math.sin(ph+2)),col);leg(56,-100,.7*Math.sin(ph+.4)+.1,-1*Math.max(0,Math.cos(ph+.4)),col);
  ctx.restore();
  return {x,y:y-146*s+Math.sin(ph*2)*4*s};
}
function wheel(x,y,r,rot){ctx.beginPath();ctx.arc(x,y,r,0,2*PI);ctx.lineWidth=9;ctx.strokeStyle='#5a3a1a';ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=OL;ctx.stroke();
  for(let i=0;i<6;i++){const a=rot+i*PI/3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.lineWidth=5;ctx.strokeStyle='#5a3a1a';ctx.stroke()}blob(x,y,7,'#d4a52f',3)}

// ================= MAPA =================
const MX=-300,MY=-220,MW=1680,MH=2360,MS=1.5;
const map=document.createElement('canvas');map.width=MW*MS;map.height=MH*MS;
function buildMap(){
  const c=map.getContext('2d');c.scale(MS,MS);c.translate(-MX,-MY);
